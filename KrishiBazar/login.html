<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · KrishiBazar</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">
  <div id="site-nav"></div>
  <div class="auth-wrap">
    <article class="card auth-card">
      <span class="tag">India roles</span>
      <h2>Enter KrishiBazar</h2>
      <p class="sub">Farmer, FPO, household or bulk buyer. Demo login stores only on this device.</p>
      <div class="roles">
        <div class="role on" data-role="farmer">👨‍🌾 Farmer</div>
        <div class="role" data-role="fpo">🏢 FPO</div>
        <div class="role" data-role="consumer">🏠 Consumer</div>
        <div class="role" data-role="bulk">🏭 Bulk buyer</div>
      </div>
      <form id="loginForm" class="form">
        <input id="name" required placeholder="Name / FPO name" />
        <input id="place" required placeholder="Village / city, state e.g. Lasalgaon, Maharashtra" />
        <input id="phone" required placeholder="Mobile (10 digit)" pattern="[0-9]{10}" />
        <button class="btn" type="submit">Continue with OTP demo</button>
      </form>
    </article>
  </div>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ai.js"></script>
</body>
</html>
