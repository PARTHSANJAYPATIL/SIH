<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expiry Alerts - eMaap</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dash">
  <div id="site-nav"></div>
  
  <section class="main">
    <div class="container flex">
      <div id="side-nav"></div>
      
      <div class="content">
        <div class="head">
          <h1>Certificate Expiry Alerts</h1>
          <p class="subtitle">Instruments approaching certificate expiry date</p>
        </div>

        <div class="card" style="margin-bottom: 20px;">
          <h2>Active Alerts</h2>
          <div id="alertsList"></div>
        </div>

        <div class="card">
          <h2>Alert History</h2>
          <table class="table" id="alertsTable">
            <thead>
              <tr>
                <th>Instrument ID</th>
                <th>Type</th>
                <th>Days Left</th>
                <th>Certificate Expires</th>
                <th>Alert Sent</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const s = requireLogin(["user"]);
      if (!s) return;
      
      const side = document.getElementById("side-nav");
      if (side) side.innerHTML = sideHTML(s.role, "alerts.html");

      // Find instruments with expiring certificates
      const myInst = instruments().filter(i => i.userId === s.id);
      const expiringAlerts = myInst.filter(inst => {
        const cert = certs().find(c => c.instrumentId === inst.id);
        const days = cert ? daysTo(cert.validTill) : null;
        return cert && days >= 0 && days <= 30;
      });

      // Display alerts
      const alertsList = document.getElementById("alertsList");
      if (expiringAlerts.length === 0) {
        alertsList.innerHTML = `<p style="padding: 20px; text-align: center; color: var(--muted);">No active expiry alerts. All certificates are valid.</p>`;
      } else {
        let html = `<div class="alert-grid">`;
        expiringAlerts.forEach(inst => {
          const cert = certs().find(c => c.instrumentId === inst.id);
          const days = daysTo(cert.validTill);
          const urgency = days <= 7 ? 'critical' : days <= 14 ? 'high' : 'medium';
          
          html += `<div class="alert-item ${urgency}">
            <div class="alert-header">
              <strong>${inst.id}</strong>
              <span class="tag ${days <= 7 ? 'bad' : 'warn'}">${days} days left</span>
            </div>
            <p>${typeOf(inst.type).name}</p>
            <p style="margin: 5px 0;"><small>Expires: <strong>${cert.validTill}</strong></small></p>
            <a href="apply.html?inst=${encodeURIComponent(inst.id)}" class="btn small" style="margin-top: 8px;">Apply for Renewal</a>
          </div>`;
        });
        html += `</div>`;
        alertsList.innerHTML = html;
      }

      // Show alert history in table
      const table = document.getElementById("alertsTable");
      expiringAlerts.forEach(inst => {
        const cert = certs().find(c => c.instrumentId === inst.id);
        const days = daysTo(cert.validTill);
        table.querySelector("tbody").innerHTML += `<tr>
          <td>${inst.id}</td>
          <td>${typeOf(inst.type).name}</td>
          <td><strong>${days}</strong></td>
          <td>${cert.validTill}</td>
          <td>${new Date().toISOString().slice(0, 10)}</td>
          <td><a href="apply.html?inst=${encodeURIComponent(inst.id)}" class="btn small">Renew</a></td>
        </tr>`;
      });
    });
  </script>

  <style>
    .alert-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .alert-item { border: 2px solid var(--line); border-radius: 10px; padding: 15px; }
    .alert-item.critical { border-left: 4px solid var(--danger); background: #fdecec; }
    .alert-item.high { border-left: 4px solid var(--warn); background: #fff7ed; }
    .alert-item.medium { border-left: 4px solid #0b5ba4; background: #e8eef8; }
    .alert-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .alert-item p { margin: 5px 0; color: var(--muted); font-size: 13px; }
  </style>
</body>
</html>
