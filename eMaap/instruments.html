<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Instruments - eMaap</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dash">
  <div id="site-nav"></div>
  
  <section class="main">
    <div class="container flex">
      <div id="side-nav"></div>
      
      <div class="content">
        <div class="head">
          <h1>My Instruments</h1>
          <div class="user-info" id="who"></div>
        </div>

        <div class="filters">
          <input type="search" id="search" placeholder="Search by ID, serial no., make/model...">
          <select id="statusFilter">
            <option value="">All Status</option>
            <option value="Valid">Valid</option>
            <option value="Expiring">Expiring Soon</option>
            <option value="Expired">Expired</option>
            <option value="Unverified">Unverified</option>
          </select>
        </div>

        <div class="action-bar">
          <a href="apply.html" class="btn saffron">Add New Instrument</a>
        </div>

        <table class="table">
          <thead>
            <tr>
              <th>Instrument ID</th>
              <th>Type</th>
              <th>Make / Model</th>
              <th>Capacity / Accuracy</th>
              <th>Location</th>
              <th>Status</th>
              <th>Certificate</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="instBody">
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const s = requireLogin(["user", "admin"]);
      if (!s) return;
      
      const side = document.getElementById("side-nav");
      if (side) side.innerHTML = sideHTML(s.role, "instruments.html");

      renderInstruments();

      // Search and filter functionality
      const search = document.getElementById("search");
      const filter = document.getElementById("statusFilter");
      
      function updateTable() {
        const query = search.value.toLowerCase();
        const status = filter.value;
        const rows = document.querySelectorAll("#instBody tr");
        
        rows.forEach(row => {
          const text = row.textContent.toLowerCase();
          const statusCell = row.cells[5]?.textContent || '';
          const matchSearch = text.includes(query);
          const matchStatus = !status || statusCell.includes(status);
          row.style.display = matchSearch && matchStatus ? '' : 'none';
        });
      }
      
      search?.addEventListener("input", updateTable);
      filter?.addEventListener("change", updateTable);
    });

    function renderInstruments() {
      const s = session(); if (!s) return;
      const mine = s.role === "user" ? instruments().filter(i => i.userId === s.id) : instruments();
      const tb = document.getElementById("instBody");
      if (!tb) return;
      
      if (mine.length === 0) {
        tb.innerHTML = `<tr><td colspan="8" style="text-align: center; padding: 40px;">
          No instruments registered yet. <a href="apply.html">Add one now</a>
        </td></tr>`;
        return;
      }
      
      tb.innerHTML = mine.map(i => {
        const cert = certs().find(c => c.instrumentId === i.id);
        const due = cert ? daysTo(cert.validTill) : null;
        let st = i.status;
        if (cert) st = due < 0 ? "Expired" : due <= 30 ? "Expiring" : "Valid";
        return `<tr>
          <td><a href="instrument.html?id=${encodeURIComponent(i.id)}">${i.id}</a></td>
          <td>${typeOf(i.type).name}</td>
          <td>${i.make} ${i.model}<br><small>${i.serial}</small></td>
          <td>${i.cap} / e=${i.e}</td>
          <td>${i.loc}</td>
          <td>${statusTag(st)}</td>
          <td>${cert ? `<a href="certificate.html?id=${encodeURIComponent(cert.id)}">${cert.id}</a>` : '—'}</td>
          <td>
            <a href="instrument.html?id=${encodeURIComponent(i.id)}" class="btn small">View</a>
            ${st === 'Expired' || st === 'Expiring' ? `<a href="apply.html?inst=${encodeURIComponent(i.id)}" class="btn small">Renew</a>` : ''}
          </td>
        </tr>`;
      }).join("");
    }
  </script>
</body>
</html>
